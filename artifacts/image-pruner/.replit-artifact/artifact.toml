kind = "mobile"
previewPath = "/"
title = "Image Pruner"
version = "1.0.0"
id = "artifacts/image-pruner"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21261

[services.development]
run = "pnpm --filter @workspace/image-pruner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/image-pruner", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/image-pruner", "run", "serve" ]

[services.env]
PORT = "21261"
BASE_PATH = "/"
